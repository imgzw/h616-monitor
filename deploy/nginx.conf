upstream fastapi {
    server 127.0.0.1:8000;
    keepalive 8;
}

upstream go2rtc {
    server 127.0.0.1:1984;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 0;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    # WebSocket support for WebRTC signaling
    location /api/ws {
        proxy_pass http://go2rtc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # go2rtc WebRTC API endpoints
    location /api/webrtc {
        proxy_pass http://go2rtc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # go2rtc stream endpoints (MJPEG, HLS, etc.)
    # MJPEG is multipart/x-mixed-replace - must disable all buffering
    location /api/stream {
        proxy_pass http://go2rtc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
    }

    # Backend API
    location /api/ {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Recording downloads - no buffering for large files
    location /api/recordings/download/ {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Frontend static files with long-lived cache for fingerprinted assets
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        root /opt/h616-monitor/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /opt/h616-monitor/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}